<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#15141b"/>
  <!-- arms: gentle S, widest at the shoulders, meeting at the base -->
  <path d="M36 20 C 31 36 34 64 46 83 C 52 92 58 97 64 99"
        fill="none" stroke="#c99a52" stroke-width="10" stroke-linecap="round"/>
  <path d="M92 20 C 97 36 94 64 82 83 C 76 92 70 97 64 99"
        fill="none" stroke="#c99a52" stroke-width="10" stroke-linecap="round"/>
  <!-- finials at the arm tips -->
  <circle cx="36" cy="18" r="6" fill="#e0b579"/>
  <circle cx="92" cy="18" r="6" fill="#e0b579"/>
  <!-- crossbar -->
  <path d="M37 42 L 91 42" stroke="#e0b579" stroke-width="9" stroke-linecap="round"/>
  <!-- strings, outer two lean with the arms -->
  <path d="M52 51 L 55 88 M64 51 L 64 95 M76 51 L 73 88"
        stroke="#ece7db" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>
  <!-- base bead where the arms meet -->
  <circle cx="64" cy="100" r="7" fill="#e0b579"/>
</svg>
